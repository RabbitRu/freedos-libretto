name: Libretto FAT32 builds

on:
  push:
    branches: [libretto]
  pull_request:
    branches: [master, libretto]
    paths:
      - 'scripts/libretto/**'
      - '.github/workflows/libretto.yml'
      - 'kernel/**'
      - 'hdr/**'
      - 'mkfiles/**'
      - 'boot/**'
      - 'drivers/**'
      - 'utils/**'
      - 'test/**'
      - 'makefile'
      - 'country'
  workflow_dispatch:
    inputs:
      compiler_scout:
        description: Run the optional Watcom settings experiment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: libretto-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cpu: ['486', pentium-mmx]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build and boot test tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends nasm qemu-system-x86 mtools dosfstools xz-utils
      - name: Install pinned Open Watcom
        run: bash scripts/libretto/bootstrap.sh
      - name: Build and boot on the target CPU with 20 and 32 MiB
        run: bash scripts/libretto/build.sh '${{ matrix.cpu }}'
      - name: Check JFT lifetime, custom tables, handle inheritance and INSTALL limits
        run: python3 scripts/libretto/kernel_checks.py '${{ matrix.cpu }}'
      - name: Check actual memory routines, ABI, segment boundaries and REP accounting
        run: python3 scripts/libretto/memory.py '${{ matrix.cpu }}'
      - name: Check FAT16/FAT32 full-volume recovery, high clusters and injected I/O errors
        run: python3 scripts/libretto/edges.py '${{ matrix.cpu }}'
      - name: Compare control and candidate with ten samples per workload
        run: python3 scripts/libretto/compare.py '${{ matrix.cpu }}'
      - name: Check chain invalidation, handles, raw FAT writes and real floppy change on both kernels
        run: python3 scripts/libretto/chains.py '${{ matrix.cpu }}'
      - name: Save kernel, map, test images and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: libretto-${{ matrix.cpu }}-fat32-${{ github.sha }}
          path: _output/libretto-${{ matrix.cpu }}-fat32/
          if-no-files-found: error

  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: ['486', pentium-mmx]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install diagnostic tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends nasm qemu-system-x86 mtools xz-utils
      - name: Install pinned Open Watcom
        run: bash scripts/libretto/bootstrap.sh
      - name: Count FAT, chain, cache and disk operations in a diagnostic kernel
        run: python3 scripts/libretto/profile.py '${{ matrix.cpu }}'
      - name: Save diagnostic counters
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: profile-${{ matrix.cpu }}-${{ github.sha }}
          path: _output/profile-${{ matrix.cpu }}/
          if-no-files-found: error

  compiler:
    if: github.event_name == 'workflow_dispatch' && inputs.compiler_scout
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cpu: ['486', pentium-mmx]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install compiler experiment tools
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86 mtools xz-utils
      - name: Install pinned Open Watcom
        run: bash scripts/libretto/bootstrap.sh
      - name: Prepare runtime and initial kernel
        run: |
          export WATCOM="$PWD/_watcom"
          export PATH="$WATCOM/binl64:$PATH"
          export LIBRETTO_TUNE=$([[ '${{ matrix.cpu }}' == 486 ]] && echo 4 || echo 5)
          make all COMPILER=owlinux XCPU=386 XFAT=32 XUPX= RM='rm -f'
          mkdir -p '_output/libretto-${{ matrix.cpu }}-fat32'
          cp bin/kwc38632.sys '_output/libretto-${{ matrix.cpu }}-fat32/KERNEL.SYS'
          python3 scripts/libretto/runtime.py _downloads/runtime-extracted
      - name: Compare size, speed, block ordering, scheduling and loop settings
        run: python3 scripts/libretto/compiler.py '${{ matrix.cpu }}'
      - name: Save compiler experiment kernels, maps and measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-${{ matrix.cpu }}-${{ github.sha }}
          path: _output/libretto-${{ matrix.cpu }}-fat32/compiler/
          if-no-files-found: error
